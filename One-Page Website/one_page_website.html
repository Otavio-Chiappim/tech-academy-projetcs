<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        section {
            padding: 40px 20px;
        }

        .gallery img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .gallery img:hover {
            opacity: 0.8;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }

        .lightbox img {
            max-width: 80%;
            max-height: 75%;
            border-radius: 8px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .prev,
        .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            color: white;
            font-size: 45px;
            font-weight: bold;
            padding: 16px;
            background: none;
            border: none;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        form input,
        form textarea {
            display: block;
            width: 80%;
            max-width: 400px;
            margin: 10px auto;
            padding: 10px;
        }

        form button {
            padding: 10px 20px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#video">Video</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my first one-page website built with HTML.</p>
    </section>

    <section id="gallery">
        <h2>Gallery</h2>

        <div class="gallery">
            <img src="image1.jpg" onclick="openLightbox(0)" alt="Image 1">
            <img src="image2.jpg" onclick="openLightbox(1)" alt="Image 2">
            <img src="image3.jpg" onclick="openLightbox(2)" alt="Image 3">
            <img src="image4.jpg" onclick="openLightbox(3)" alt="Image 4">
        </div>
    </section>

    <section id="video">
        <h2>My Video</h2>
        <iframe width="560" height="315" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" 
            allowfullscreen>
        </iframe>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>

        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea placeholder="Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large Image">

        <button class="next" onclick="changeImage(1)">&#10095;</button>
    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

    <script src="one_page_website.js"></script>

</body>
</html>
