<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        section {
            padding: 40px;
        }

        .gallery img {
            width: 30%;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            opacity: 0.8;
        }

        /* Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        footer {
            padding: 20px;
            background: #eee;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">Video</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h1>Welcome to My Website</h1>
        <p>This is my first one-page website built with HTML.</p>
    </section>

    <section>
        <h2>Gallery</h2>

        <div class="gallery">
            <img src="https://picsum.photos/id/1015/400/300" onclick="openModal(this)">
            <img src="https://picsum.photos/id/1016/400/300" onclick="openModal(this)">
            <img src="https://picsum.photos/id/1018/400/300" onclick="openModal(this)">
        </div>
    </section>

    <section>
        <h2>My Video</h2>

        <iframe width="560" height="315"
        src="https://www.youtube.com/embed/tgbNymZ7vqY">
        </iframe>
    </section>

    <section>
        <h2>Contact Me</h2>

        <form>
            <label>Name:</label><br><br>
            <input type="text"><br><br>

            <label>Email:</label><br><br>
            <input type="email"><br><br>

            <label>Message:</label><br><br>
            <textarea rows="5"></textarea><br><br>

            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        © 2026 My Website
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="lightbox-img">
    </div>

    <script src="JS/one_page_website.js"></script>

</body>
</html>
